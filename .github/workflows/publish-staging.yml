name: Publish Staging (测试服)

# 把任意分支发到测试服，不影响正式地址。
# 测试服：https://urrrerin.github.io/Urrrerin/staging/
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-staging
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocab-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vocab-app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_ENV: staging
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Publish dist to gh-pages/staging
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: vocab-app/dist
          publish_branch: gh-pages
          destination_dir: staging
          keep_files: true
          commit_message: 'deploy(staging): preview build'
