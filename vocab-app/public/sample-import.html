<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>示例词表 HTML（可导入）</title>
  </head>
  <body>
    <h1>哈利波特词汇示例</h1>
    <p>把你自己的词表整理成类似表格后，在 App 里点「导入 HTML」即可。</p>
    <table>
      <thead>
        <tr>
          <th>单词</th>
          <th>音标</th>
          <th>释义</th>
          <th>频次</th>
          <th>标签</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>muggle</td>
          <td>/ˈmʌɡl/</td>
          <td>麻瓜</td>
          <td>86</td>
          <td>其他</td>
        </tr>
        <tr>
          <td>corridor</td>
          <td>/ˈkɒrɪdɔː/</td>
          <td>走廊</td>
          <td>58</td>
          <td>四级 六级</td>
        </tr>
        <tr>
          <td>peculiar</td>
          <td>/pɪˈkjuːliə/</td>
          <td>奇怪的；特有的</td>
          <td>29</td>
          <td>六级</td>
        </tr>
        <tr>
          <td>vanish</td>
          <td>/ˈvænɪʃ/</td>
          <td>消失</td>
          <td>41</td>
          <td>四级 高考</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
